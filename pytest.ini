[pytest]
# Both suites contain similarly named modules (for example,
# test_update_parser.py).  importlib mode keeps their module identities
# distinct and avoids collection collisions while packages are reorganized.
testpaths =
    backend/tests
    packages/bale-pv-client/tests
pythonpath =
    backend/src
    packages/bale-pv-client/src
addopts = --import-mode=importlib -ra -q
asyncio_mode = auto
